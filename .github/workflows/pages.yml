name: Publish dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 20 * * *"
      timezone: Europe/Madrid
    - cron: "30 21 * * *"
      timezone: Europe/Madrid
    - cron: "30 22 * * *"
      timezone: Europe/Madrid
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just check
      - uses: actions/cache@v4
        with:
          path: .cache/trends.json
          key: pvpc-trends-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pvpc-trends-v1-${{ runner.os }}-
      - run: nix develop --command just update
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
